{% extends 'base.html' %}
{% block title %}Edit {{ member.full_name }} — ClubSphere{% endblock %}
{% block page_title %}Edit Member: {{ member.full_name }}{% endblock %}

{% block content %}
<div style="max-width: 860px;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Update Member Profile</h2>
      <a href="{{ url_for('member_view', member_id=member.id) }}" class="btn btn-sm btn-secondary">&larr; Cancel</a>
    </div>
    <div class="card-body">
      <form action="{{ url_for('members_edit', member_id=member.id) }}" method="POST">
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="full_name">Full Name *</label>
            <input type="text" id="full_name" name="full_name" class="form-control" value="{{ member.full_name }}" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ member.email }}" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" class="form-control" value="{{ member.phone or '' }}">
          </div>

          <div class="form-group">
            <label class="form-label" for="student_id">Student ID</label>
            <input type="text" id="student_id" name="student_id" class="form-control" value="{{ member.student_id or '' }}">
          </div>

          <div class="form-group">
            <label class="form-label" for="department">Department</label>
            <input type="text" id="department" name="department" class="form-control" value="{{ member.department or '' }}">
          </div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="membership_type">Membership Tier</label>
            <select id="membership_type" name="membership_type" class="form-select">
              <option value="Annual" {% if member.membership_type == 'Annual' %}selected{% endif %}>Annual</option>
              <option value="Semester" {% if member.membership_type == 'Semester' %}selected{% endif %}>Semester</option>
              <option value="Lifetime" {% if member.membership_type == 'Lifetime' %}selected{% endif %}>Lifetime</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="status">Membership Status</label>
            <select id="status" name="status" class="form-select">
              <option value="Active" {% if member.status == 'Active' %}selected{% endif %}>Active</option>
              <option value="Pending" {% if member.status == 'Pending' %}selected{% endif %}>Pending</option>
              <option value="Expired" {% if member.status == 'Expired' %}selected{% endif %}>Expired</option>
              <option value="Suspended" {% if member.status == 'Suspended' %}selected{% endif %}>Suspended</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="membership_fee">Total Fee (₹)</label>
            <input type="number" step="0.01" min="0" id="membership_fee" name="membership_fee" class="form-control" value="{{ member.membership_fee }}" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="join_date">Start Date *</label>
            <input type="date" id="join_date" name="join_date" class="form-control" value="{{ member.join_date }}" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="expiry_date">Expiry Date *</label>
            <input type="date" id="expiry_date" name="expiry_date" class="form-control" value="{{ member.expiry_date }}" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="notes">Notes</label>
          <textarea id="notes" name="notes" class="form-control" rows="3">{{ member.notes or '' }}</textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{{ url_for('member_view', member_id=member.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
