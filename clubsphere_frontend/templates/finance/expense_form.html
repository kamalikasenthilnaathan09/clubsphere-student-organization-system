{% extends 'base.html' %}
{% block title %}Submit Expense Request — ClubSphere{% endblock %}
{% block page_title %}New Expense Reimbursement Claim{% endblock %}

{% block content %}
<div style="max-width: 760px;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Expense Request Details</h2>
      <a href="{{ url_for('expenses_list') }}" class="btn btn-sm btn-secondary">&larr; Back to Expenses</a>
    </div>
    <div class="card-body">
      <form action="{{ url_for('expenses_new') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="title">Expense Title *</label>
          <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Refreshments for Hackathon Day 1 / Banners Printing" value="{{ form_data.title if form_data else '' }}" required autofocus>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="category">Expense Category *</label>
            <select id="category" name="category" class="form-select" required>
              <option value="Event Logistics">Event Logistics & Setup</option>
              <option value="Refreshments">Food & Refreshments</option>
              <option value="Marketing & Printing">Marketing, Posters & Printing</option>
              <option value="Equipment & Tech">Equipment, Cables & Audio/Visual</option>
              <option value="Decorations">Decorations & Badges</option>
              <option value="Prizes & Trophies">Prizes & Trophies</option>
              <option value="Other">Other Operational Expense</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="amount">Claim Amount (₹) *</label>
            <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" placeholder="1250.00" value="{{ form_data.amount if form_data else '' }}" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="event_id">Associated Event (Optional)</label>
            <select id="event_id" name="event_id" class="form-select">
              <option value="">General Club Expense (No specific event)</option>
              {% for ev in events %}
              <option value="{{ ev.id }}">{{ ev.title }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="receipt_ref">Receipt / Bill / Invoice Number</label>
            <input type="text" id="receipt_ref" name="receipt_ref" class="form-control" placeholder="e.g. INV-2026-0428" value="{{ form_data.receipt_ref if form_data else '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Detailed Description & Justification *</label>
          <textarea id="description" name="description" class="form-control" rows="3" placeholder="Explain the necessity of this expense and items purchased..." required>{{ form_data.description if form_data else '' }}</textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Submit for Approval</button>
          <a href="{{ url_for('expenses_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
