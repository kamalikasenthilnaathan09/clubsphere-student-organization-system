<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aiTechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0a1533" />
      <stop offset="80%" stop-color="#0e1f4d" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Cyan & Electric Blue Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="violetAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Circuit Pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#aiTechBg)" />
  <rect width="800" height="450" fill="url(#circuitGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="630" cy="180" r="170" fill="#00f2fe" opacity="0.12" filter="url(#cyanGlow)" />
  <circle cx="180" cy="280" r="180" fill="#6366f1" opacity="0.15" filter="url(#cyanGlow)" />

  <!-- Circuit Pattern Traces -->
  <g stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.8" fill="none">
    <path d="M 0 160 L 140 160 L 180 200 L 280 200" />
    <path d="M 80 50 L 150 120 L 240 120" />
    <path d="M 50 380 L 160 270 L 260 270" stroke="rgba(168, 85, 247, 0.4)" />
    <path d="M 500 80 L 580 80 L 620 120 L 750 120" />
    <path d="M 520 370 L 610 280 L 760 280" stroke="rgba(96, 165, 250, 0.4)" />
  </g>

  <!-- Circuit Nodes -->
  <circle cx="280" cy="200" r="4.5" fill="#00f2fe" filter="url(#cyanGlow)" />
  <circle cx="240" cy="120" r="3.5" fill="#38bdf8" />
  <circle cx="260" cy="270" r="4" fill="#a855f7" />
  <circle cx="500" cy="80" r="3.5" fill="#00f2fe" />
  <circle cx="620" cy="120" r="4" fill="#60a5fa" />

  <!-- Futuristic Robot Profile (Right Side) -->
  <g transform="translate(620, 220)">
    <!-- Hexagonal Tech Shield -->
    <polygon points="0,-115 100,-58 100,58 0,115 -100,58 -100,-58" fill="rgba(10, 21, 51, 0.85)" stroke="url(#cyanGrad)" stroke-width="2.5" />
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="none" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1.2" stroke-dasharray="6 4" />
    
    <!-- Rotating Halo Orbit -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="0" cy="0" r="52" fill="#060c1e" stroke="url(#electricBlue)" stroke-width="2" />

    <!-- Robot Cranial Silhouette & Optical Core -->
    <path d="M -24 -24 C -12 -38 12 -38 24 -24 C 32 -10 28 18 16 26 C 6 34 -6 34 -16 26 C -28 18 -32 -10 -24 -24 Z" fill="none" stroke="#00f2fe" stroke-width="2.2" />
    <circle cx="0" cy="-6" r="11" fill="url(#cyanGrad)" filter="url(#cyanGlow)" />
    <!-- Neural Optical Elements -->
    <circle cx="-16" cy="-14" r="3.5" fill="#ffffff" />
    <circle cx="16" cy="-14" r="3.5" fill="#ffffff" />
    <circle cx="-12" cy="12" r="3" fill="#a855f7" />
    <circle cx="12" cy="12" r="3" fill="#a855f7" />
    <line x1="-16" y1="-14" x2="0" y2="-6" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" />
    <line x1="16" y1="-14" x2="0" y2="-6" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" />
    <line x1="-12" y1="12" x2="0" y2="-6" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" />
    <line x1="12" y1="12" x2="0" y2="-6" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" />

    <!-- Status Chip -->
    <rect x="-46" y="68" width="92" height="22" rx="6" fill="#030712" stroke="#00f2fe" stroke-width="1" />
    <text x="0" y="83" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ROBOTICS AI</text>
  </g>

  <!-- Left Side: Poster Content & Typography -->
  <!-- Top Badge -->
  <g transform="translate(60, 60)">
    <rect width="260" height="30" rx="15" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.5)" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#00f2fe" filter="url(#cyanGlow)" />
    <text x="32" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="2">AI &amp; ROBOTICS HACKFEST</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    AI &amp; ROBOTICS
  </text>
  <text x="60" y="195" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#cyanGrad)" letter-spacing="0">
    National Hackathon 2026
  </text>

  <!-- Subtitle -->
  <text x="60" y="240" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Autonomous Systems &bull; Neural Hardware &bull; 36-Hour National Sprint
  </text>

  <!-- Feature Badges -->
  <g transform="translate(60, 275)">
    <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="65" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe" text-anchor="middle">⚡ 36H SPRINT</text>

    <rect x="142" y="0" width="150" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <text x="217" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f3e8ff" text-anchor="middle">🏆 ₹50,000 PRIZES</text>

    <rect x="304" y="0" width="140" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="374" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe" text-anchor="middle">🤖 HARDWARE LAB</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 360)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
      📍 MAIN AUDITORIUM &amp; INNOVATION LAB
    </text>
    <text x="680" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#a855f7" text-anchor="end">
      CLUBS PHERE TECH LEAGUE &bull; 2026
    </text>
  </g>
</svg>
