<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#rgrad)" />
  <circle cx="400" cy="180" r="140" fill="#10b981" opacity="0.12" filter="blur(30px)" />
  
  <!-- Robot Icon / Tech Graphic -->
  <g transform="translate(400, 160)">
    <rect x="-45" y="-45" width="90" height="80" rx="14" fill="#1f2937" stroke="url(#emeraldGrad)" stroke-width="3" />
    <!-- Eyes -->
    <circle cx="-18" cy="-12" r="10" fill="#06b6d4" />
    <circle cx="18" cy="-12" r="10" fill="#06b6d4" />
    <circle cx="-16" cy="-14" r="4" fill="#ffffff" />
    <circle cx="20" cy="-14" r="4" fill="#ffffff" />
    <!-- Mouth / Grid -->
    <line x1="-20" y1="16" x2="20" y2="16" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Antennas -->
    <line x1="0" y1="-45" x2="0" y2="-65" stroke="url(#emeraldGrad)" stroke-width="3" />
    <circle cx="0" cy="-68" r="6" fill="#f59e0b" />
    <!-- Gears -->
    <circle cx="-75" cy="0" r="14" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3" />
    <circle cx="75" cy="0" r="14" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3" />
  </g>

  <text x="400" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    ROBOTICS &amp; AUTOMATION EXPO
  </text>
  <text x="400" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="2">
    HANDS-ON HARDWARE &bull; AI CONTROLLERS &bull; BOTS
  </text>
</svg>
