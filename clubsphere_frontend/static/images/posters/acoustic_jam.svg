<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="warmStageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="35%" stop-color="#180b2a" />
      <stop offset="70%" stop-color="#2d1238" />
      <stop offset="100%" stop-color="#19062a" />
    </linearGradient>

    <!-- Warm Amber & Sunset Glow Gradients -->
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="sunsetRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="stageSpotlight1" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0518" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="stageSpotlight2" cx="80%" cy="10%" r="85%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a0518" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Glow Filters -->
    <filter id="warmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#warmStageBg)" />
  <rect width="800" height="450" fill="url(#stageSpotlight1)" />
  <rect width="800" height="450" fill="url(#stageSpotlight2)" />

  <!-- Overhead Spotlight Beams -->
  <polygon points="120,0 320,450 0,450" fill="url(#amberGold)" opacity="0.07" />
  <polygon points="680,0 800,450 480,450" fill="url(#sunsetRose)" opacity="0.06" />

  <!-- Bokeh Warm Particles -->
  <g opacity="0.45">
    <circle cx="120" cy="80" r="14" fill="#fbbf24" filter="url(#softBlur)" />
    <circle cx="280" cy="60" r="22" fill="#f43f5e" filter="url(#softBlur)" />
    <circle cx="480" cy="110" r="16" fill="#fbbf24" filter="url(#softBlur)" />
    <circle cx="720" cy="90" r="28" fill="#c084fc" filter="url(#softBlur)" />
    <circle cx="200" cy="220" r="10" fill="#fbbf24" filter="url(#softBlur)" />
    <circle cx="580" cy="280" r="18" fill="#fb7185" filter="url(#softBlur)" />
    <circle cx="700" cy="360" r="12" fill="#fbbf24" filter="url(#softBlur)" />
  </g>

  <!-- Soundwave Concentric Rings behind Guitar -->
  <g transform="translate(620, 225)" opacity="0.4" stroke="#fbbf24" fill="none">
    <circle cx="0" cy="0" r="70" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="105" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="140" stroke-width="0.8" stroke-dasharray="3 5" />
    <circle cx="0" cy="0" r="175" stroke-width="0.5" stroke-dasharray="10 8" />
  </g>

  <!-- Acoustic Guitar & Stage Silhouette (Right Side) -->
  <g transform="translate(620, 220)">
    <!-- Aura Glow -->
    <ellipse cx="0" cy="20" rx="90" ry="110" fill="#f59e0b" opacity="0.2" filter="url(#warmGlow)" />

    <!-- Guitar Body Silhouette -->
    <!-- Lower Bout -->
    <path d="M 0 -130 
             L 0 -50 
             C -25 -45 -55 -25 -55 10 
             C -55 35 -35 50 -25 60 
             C -65 80 -75 125 -45 160 
             C -20 185 20 185 45 160 
             C 75 125 65 80 25 60 
             C 35 50 55 35 55 10 
             C 55 -25 25 -45 0 -50 Z" 
          fill="#1c0f2b" stroke="url(#amberGold)" stroke-width="2.5" />

    <!-- Soundhole & Rosette -->
    <circle cx="0" cy="15" r="24" fill="#0d0517" stroke="url(#amberGold)" stroke-width="2" />
    <circle cx="0" cy="15" r="28" fill="none" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="15" r="8" fill="#fbbf24" opacity="0.3" filter="url(#warmGlow)" />

    <!-- Bridge & Saddle -->
    <rect x="-18" y="95" width="36" height="8" rx="2" fill="#d97706" />

    <!-- Strings -->
    <line x1="-5" y1="-130" x2="-5" y2="95" stroke="#fef3c7" stroke-width="1" opacity="0.75" />
    <line x1="-2" y1="-130" x2="-2" y2="95" stroke="#fef3c7" stroke-width="1" opacity="0.85" />
    <line x1="2" y1="-130" x2="2" y2="95" stroke="#fef3c7" stroke-width="1" opacity="0.85" />
    <line x1="5" y1="-130" x2="5" y2="95" stroke="#fef3c7" stroke-width="1" opacity="0.75" />

    <!-- Neck & Headstock -->
    <rect x="-7" y="-140" width="14" height="90" fill="#2d1340" stroke="#f59e0b" stroke-width="1" />
    <path d="M -9 -140 L 9 -140 L 12 -170 L -12 -170 Z" fill="#3b1754" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Tuning Pegs -->
    <circle cx="-15" cy="-160" r="3" fill="#fbbf24" />
    <circle cx="-15" cy="-150" r="3" fill="#fbbf24" />
    <circle cx="15" cy="-160" r="3" fill="#fbbf24" />
    <circle cx="15" cy="-150" r="3" fill="#fbbf24" />

    <!-- Floating Musical Notes -->
    <!-- Eighth note 1 -->
    <g transform="translate(-100, -60)" fill="#fbbf24" opacity="0.85">
      <ellipse cx="6" cy="14" rx="6" ry="4" transform="rotate(-25 6 14)" />
      <rect x="10" y="-8" width="2.5" height="22" />
      <path d="M 12.5 -8 C 22 -6 20 4 23 8" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    </g>
    <!-- Quarter note 2 -->
    <g transform="translate(85, -40)" fill="#c084fc" opacity="0.8">
      <ellipse cx="5" cy="12" rx="5.5" ry="3.5" transform="rotate(-25 5 12)" />
      <rect x="9" y="-6" width="2" height="18" />
    </g>
    <!-- Note 3 -->
    <g transform="translate(-80, 80)" fill="#f43f5e" opacity="0.75">
      <ellipse cx="5" cy="10" rx="5" ry="3.5" transform="rotate(-25 5 10)" />
      <rect x="9" y="-6" width="2" height="16" />
    </g>
  </g>

  <!-- Left Side: Poster Content & Typography -->
  <!-- Top Badge / Pill -->
  <g transform="translate(60, 60)">
    <rect width="255" height="30" rx="15" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#fbbf24" filter="url(#warmGlow)" />
    <text x="32" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fde68a" letter-spacing="2">ACOUSTIC LIVE SESSIONS</text>
  </g>

  <!-- Big Bold Title -->
  <text x="60" y="145" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    WINTER ACOUSTIC JAM
  </text>
  <text x="60" y="195" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#amberGold)" letter-spacing="0">
    &amp; Open Mic Night
  </text>

  <!-- Tagline / Pitch -->
  <text x="60" y="240" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
    An intimate evening of live unplugged music, poetry, and warm campus community.
  </text>

  <!-- Highlights Badges -->
  <g transform="translate(60, 275)">
    <!-- Badge 1: Acoustic Sets -->
    <rect x="0" y="0" width="140" height="34" rx="8" fill="rgba(30, 15, 45, 0.85)" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1" />
    <text x="70" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle">🎸 LIVE UNPLUGGED</text>

    <!-- Badge 2: Open Mic -->
    <rect x="152" y="0" width="130" height="34" rx="8" fill="rgba(30, 15, 45, 0.85)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
    <text x="217" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffe4e6" text-anchor="middle">🎙️ OPEN MIC SLOTS</text>

    <!-- Badge 3: Hot Cocoa -->
    <rect x="294" y="0" width="135" height="34" rx="8" fill="rgba(30, 15, 45, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <text x="361" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f3e8ff" text-anchor="middle">☕ WARM REFRESH</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 360)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
      📍 STUDENT COMMONS AMPHITHEATRE &bull; 6:00 PM ONWARDS
    </text>
    <text x="680" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fb7185" text-anchor="end">
      CAMPUS MUSIC COLLECTIVE &bull; 2026
    </text>
  </g>
</svg>
