<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="summitNavyPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817" />
      <stop offset="35%" stop-color="#0b122e" />
      <stop offset="70%" stop-color="#19133b" />
      <stop offset="100%" stop-color="#241442" />
    </linearGradient>

    <!-- Regal Gold & Purple Gradients -->
    <linearGradient id="summitGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>
    <linearGradient id="purpleRoyal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Stage Beam Radial -->
    <radialGradient id="stageBeam" cx="75%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040817" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Geometric Line Pattern -->
    <pattern id="summitPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 25 25 L 0 0 M 25 25 L 25 50" fill="none" stroke="rgba(253, 224, 71, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="goldGlowTone" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#summitNavyPurpleBg)" />
  <rect width="800" height="450" fill="url(#summitPattern)" />
  <rect width="800" height="450" fill="url(#stageBeam)" />

  <!-- Ambient Light Orbs -->
  <circle cx="640" cy="160" r="180" fill="#f59e0b" opacity="0.12" filter="url(#goldGlowTone)" />
  <circle cx="180" cy="300" r="190" fill="#7c3aed" opacity="0.16" filter="url(#goldGlowTone)" />

  <!-- Executive Stage Light Beams -->
  <polygon points="640,0 750,450 530,450" fill="rgba(253, 224, 71, 0.07)" />
  <polygon points="280,0 420,450 180,450" fill="rgba(124, 58, 237, 0.06)" />

  <!-- Executive Crest & Alumni Network Emblem (Right Side) -->
  <g transform="translate(620, 220)">
    <!-- Outer Shield Diamond -->
    <polygon points="0,-120 105,-35 85,95 -85,95 -105,-35" fill="rgba(11, 18, 46, 0.88)" stroke="url(#summitGoldGrad)" stroke-width="2.5" />
    <polygon points="0,-105 90,-30 72,82 -72,82 -90,-30" fill="none" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" stroke-dasharray="6 4" />

    <!-- Central Globe & Network Sphere -->
    <circle cx="0" cy="0" r="58" fill="#0d1433" stroke="url(#purpleRoyal)" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="rgba(253, 224, 71, 0.3)" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="26" ry="58" fill="none" stroke="rgba(253, 224, 71, 0.3)" stroke-width="1" />
    <line x1="-58" y1="0" x2="58" y2="0" stroke="rgba(253, 224, 71, 0.3)" stroke-width="1" />
    <line x1="0" y1="-58" x2="0" y2="58" stroke="rgba(253, 224, 71, 0.3)" stroke-width="1" />

    <!-- Interconnected Alumni Network Stars -->
    <circle cx="0" cy="-28" r="5" fill="#fde047" filter="url(#goldGlowTone)" />
    <circle cx="-32" cy="12" r="4" fill="#60a5fa" />
    <circle cx="34" cy="8" r="4" fill="#c084fc" />
    <circle cx="0" cy="34" r="3.5" fill="#fde047" />

    <line x1="0" y1="-28" x2="-32" y2="12" stroke="rgba(253, 224, 71, 0.7)" stroke-width="1.5" />
    <line x1="0" y1="-28" x2="34" y2="8" stroke="rgba(253, 224, 71, 0.7)" stroke-width="1.5" />
    <line x1="-32" y1="12" x2="0" y2="34" stroke="rgba(253, 224, 71, 0.6)" stroke-width="1.2" />
    <line x1="34" y1="8" x2="0" y2="34" stroke="rgba(253, 224, 71, 0.6)" stroke-width="1.2" />

    <!-- Banner Ribbon -->
    <rect x="-65" y="65" width="130" height="24" rx="6" fill="#040817" stroke="url(#summitGoldGrad)" stroke-width="1.2" />
    <text x="0" y="81" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="1.5">GLOBAL NETWORK</text>
  </g>

  <!-- Left Side: Poster Content & Typography -->
  <!-- Top Badge -->
  <g transform="translate(60, 60)">
    <rect width="270" height="30" rx="15" fill="rgba(234, 179, 8, 0.15)" stroke="rgba(234, 179, 8, 0.5)" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#fde047" filter="url(#goldGlowTone)" />
    <text x="32" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fde047" letter-spacing="2">EXECUTIVE LEADERSHIP SERIES</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    ALUMNI CAREER &amp;
  </text>
  <text x="60" y="195" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="url(#summitGoldGrad)" letter-spacing="0">
    Leadership Summit
  </text>

  <!-- Subtitle -->
  <text x="60" y="240" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Keynote Panels &bull; Executive Mentorship &bull; Networking Gala Evening
  </text>

  <!-- Feature Badges -->
  <g transform="translate(60, 275)">
    <rect x="0" y="0" width="140" height="34" rx="8" fill="rgba(10, 16, 38, 0.85)" stroke="rgba(253, 224, 71, 0.35)" stroke-width="1" />
    <text x="70" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle">🎙️ KEYNOTE PANELS</text>

    <rect x="152" y="0" width="150" height="34" rx="8" fill="rgba(10, 16, 38, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <text x="227" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f3e8ff" text-anchor="middle">🤝 1-ON-1 MENTORSHIP</text>

    <rect x="314" y="0" width="135" height="34" rx="8" fill="rgba(10, 16, 38, 0.85)" stroke="rgba(253, 224, 71, 0.35)" stroke-width="1" />
    <text x="381" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle">🥂 NETWORKING GALA</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 360)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fde047">
      📍 CONVENTION CENTER AUDITORIUM &bull; EXECUTIVE SUITE
    </text>
    <text x="680" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#c084fc" text-anchor="end">
      ALUMNI RELATIONS &bull; 2026
    </text>
  </g>
</svg>
