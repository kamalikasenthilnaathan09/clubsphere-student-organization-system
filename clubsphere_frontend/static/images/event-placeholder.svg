<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <circle cx="240" cy="135" r="280" fill="url(#glow1)" />
  <circle cx="640" cy="315" r="240" fill="url(#glow2)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Central Emblem -->
  <g transform="translate(400, 185)">
    <!-- Outer Glow Ring -->
    <circle r="72" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
    <!-- Center Disc -->
    <circle r="56" fill="#1e1b4b" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <!-- Calendar & Star Icon -->
    <path d="M-22 -14 h44 v36 a6 6 0 0 1 -6 6 h-32 a6 6 0 0 1 -6 -6 z" fill="none" stroke="#a78bfa" stroke-width="3.5" />
    <path d="M-22 -14 h44 v10 h-44 z" fill="url(#accentGrad)" />
    <line x1="-12" y1="-22" x2="-12" y2="-12" stroke="#e0e7ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="12" y1="-22" x2="12" y2="-12" stroke="#e0e7ff" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="-8" cy="8" r="2.5" fill="#f43f5e" />
    <circle cx="0" cy="8" r="2.5" fill="#a78bfa" />
    <circle cx="8" cy="8" r="2.5" fill="#38bdf8" />
    <circle cx="-8" cy="18" r="2.5" fill="#a78bfa" />
    <circle cx="0" cy="18" r="2.5" fill="#34d399" />
    <circle cx="8" cy="18" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Typography -->
  <text x="400" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    ClubSphere Event
  </text>
  <text x="400" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    STUDENT ORGANIZATION SYSTEM &bull; CAMPUS ACTIVITIES
  </text>
  
  <!-- Decorative Pill Badge -->
  <g transform="translate(400, 375)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="0.8">
      OFFICIAL EVENT
    </text>
  </g>
</svg>
